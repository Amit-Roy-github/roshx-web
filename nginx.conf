# nginx config for the roshx-web Cloud Run service.
#
# - Listens on ${PORT} (Cloud Run injects PORT=8080 by default).
# - Serves the built Vite bundle with SPA fallback so react-router paths like
#   /practice and /admin resolve to index.html on a hard refresh.
# - Reverse-proxies /api/* to lal-ju-server, so the app keeps its relative
#   `/api` baseURL in production exactly as in dev, with no CORS dance.
#
# This file is a template — the nginx:alpine entrypoint runs `envsubst` over
# /etc/nginx/templates/*.template before nginx starts.

server {
    listen       ${PORT};
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Vite filenames already carry a content hash, so they can be cached hard.
    location /assets/ {
        access_log off;
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    location /api/ {
        proxy_pass         https://lal-ju-server-933507864701.asia-south1.run.app/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              lal-ju-server-933507864701.asia-south1.run.app;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;

        # Passage generation is a model call — it routinely takes 10s+, and a
        # cold start on top of that would 504 at nginx's 60s default.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    gzip              on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
